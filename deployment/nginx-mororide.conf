# Replace /var/www/mororide/backend if the release is installed elsewhere.
server {
    listen 80;
    server_name mororide.com www.mororide.com;
    return 301 https://mororide.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mororide.com www.mororide.com;

    root /var/www/mororide/backend/public;
    index index.php;
    client_max_body_size 20M;

    ssl_certificate /etc/letsencrypt/live/mororide.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mororide.com/privkey.pem;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /app/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8080;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ /\. { deny all; }
}


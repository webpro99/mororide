[program:mororide-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/mororide/backend/artisan queue:work redis --sleep=2 --tries=3 --timeout=120
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/mororide/backend/storage/logs/worker.log

[program:mororide-reverb]
command=php /var/www/mororide/backend/artisan reverb:start --host=0.0.0.0 --port=8080
directory=/var/www/mororide/backend
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/mororide/backend/storage/logs/reverb.log

